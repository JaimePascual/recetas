<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equivalencia Huevos por Claras</title>
    <style>
        /* Reset básico */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Fuente del sistema, moderna y legible */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f4f7f6;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .card {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px 20px;
            max-width: 900px;
            width: 100%;
            border-top: 10px solid #e67e22; /* Color naranja de tus recetas */
        }

        .title {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .equivalence {
            /* clamp(tamaño_minimo, tamaño_preferido, tamaño_maximo) */
            /* Esto hace que la fuente sea enorme pero responsive */
            font-size: clamp(3rem, 12vw, 8rem);
            font-weight: 900;
            line-height: 1.1;
            color: #2c3e50;
            margin: 20px 0;
        }

        .highlight {
            color: #e67e22;
        }

        .subtitle {
            font-size: clamp(1.5rem, 5vw, 3rem);
            font-weight: 600;
            color: #34495e;
            margin-top: 10px;
            background-color: #fcf3cf;
            padding: 15px 30px;
            border-radius: 50px;
            display: inline-block;
        }

        .note {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: #95a5a6;
            margin-top: 30px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="title">Equivalencia para tus recetas</div>
        
        <div class="equivalence">
            1 Huevo <span class="highlight">=</span> 2 Claras
        </div>
        
        <div class="subtitle">
            (o 60g de clara líquida)
        </div>

        <p class="note">Usa esta medida para mantener la textura y el volumen en tus tortillas y horneados.</p>
    </div>

</body>
</html>
